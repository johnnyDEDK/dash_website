<svg viewBox="0 0 120 55" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold gradient for left ring -->
    <linearGradient id="goldL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d4a0" />
      <stop offset="20%" stop-color="#d4b878" />
      <stop offset="50%" stop-color="#c8a050" />
      <stop offset="80%" stop-color="#b89040" />
      <stop offset="100%" stop-color="#a07830" />
    </linearGradient>

    <!-- Gold gradient for right ring -->
    <linearGradient id="goldR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0e0b0" />
      <stop offset="20%" stop-color="#dcc888" />
      <stop offset="50%" stop-color="#d0b060" />
      <stop offset="80%" stop-color="#c0a048" />
      <stop offset="100%" stop-color="#a88838" />
    </linearGradient>

    <!-- Inner edge highlight -->
    <linearGradient id="innerHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffef0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c09030" stop-opacity="0" />
    </linearGradient>

    <!-- Clip path: reveals only the bottom-left overlap area for front of left ring -->
    <clipPath id="leftRingFront">
      <rect x="45" y="27" width="25" height="28" />
    </clipPath>

    <!-- Clip path: hides the bottom-left overlap area for back of left ring -->
    <clipPath id="leftRingBack">
      <path d="M 0 0 L 120 0 L 120 55 L 0 55 Z M 45 27 L 70 27 L 70 55 L 45 55 Z" clip-rule="evenodd" />
    </clipPath>
  </defs>

  <!-- Shadow under rings -->
  <ellipse cx="60" cy="50" rx="35" ry="4" fill="#a09080" opacity="0.2" />

  <!-- Layer 1: Left ring BACK (behind right ring, clipped to hide overlap area) -->
  <g clip-path="url(#leftRingBack)">
    <circle cx="45" cy="27" r="17" fill="none" stroke="url(#goldL)" stroke-width="6" />
    <circle cx="45" cy="27" r="14.5" fill="none" stroke="url(#innerHighlight)" stroke-width="1" />
  </g>

  <!-- Layer 2: Right ring COMPLETE (middle layer) -->
  <circle cx="75" cy="27" r="17" fill="none" stroke="url(#goldR)" stroke-width="6" />
  <circle cx="75" cy="27" r="14.5" fill="none" stroke="url(#innerHighlight)" stroke-width="1" />

  <!-- Layer 3: Left ring FRONT (in front of right ring, only the overlap area) -->
  <g clip-path="url(#leftRingFront)">
    <circle cx="45" cy="27" r="17" fill="none" stroke="url(#goldL)" stroke-width="6" />
    <circle cx="45" cy="27" r="14.5" fill="none" stroke="url(#innerHighlight)" stroke-width="1" />
  </g>
</svg>
