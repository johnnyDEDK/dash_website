<svg viewBox="0 0 180 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fade mask for soft edges -->
    <linearGradient id="hFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="15%" stop-color="white" stop-opacity="0.6" />
      <stop offset="30%" stop-color="white" stop-opacity="1" />
      <stop offset="70%" stop-color="white" stop-opacity="1" />
      <stop offset="85%" stop-color="white" stop-opacity="0.6" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="vFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.5" />
      <stop offset="15%" stop-color="white" stop-opacity="1" />
      <stop offset="85%" stop-color="white" stop-opacity="1" />
      <stop offset="100%" stop-color="white" stop-opacity="0.5" />
    </linearGradient>

    <mask id="fadeMask">
      <rect x="0" y="0" width="180" height="80" fill="url(#hFade)" />
    </mask>

    <mask id="fullFade">
      <rect x="0" y="0" width="180" height="80" fill="url(#vFade)" mask="url(#fadeMask)" />
    </mask>

    <!-- Route line gradient -->
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a47864" />
      <stop offset="100%" stop-color="#c49484" />
    </linearGradient>
  </defs>

  <g mask="url(#fullFade)">
    <!-- Subtle background texture -->
    <rect x="0" y="0" width="180" height="80" fill="#f8f4f0" opacity="0.3" />

    <!-- Chiemsee lake - abstract shape -->
    <ellipse cx="115" cy="38" rx="12" ry="8" fill="#c8d8e8" opacity="0.5" />
    <ellipse cx="118" cy="40" rx="6" ry="4" fill="#b8c8d8" opacity="0.4" />

    <!-- Smaller lakes (Tegernsee area) -->
    <ellipse cx="58" cy="58" rx="3" ry="5" fill="#c8d8e8" opacity="0.4" />
    <ellipse cx="68" cy="55" rx="2" ry="4" fill="#c8d8e8" opacity="0.35" />

    <!-- Route line - curved path from Munich to Ruhpolding -->
    <path d="M 30 32
             Q 50 35, 70 40
             Q 90 45, 110 50
             Q 130 55, 150 62"
          fill="none"
          stroke="url(#routeGrad)"
          stroke-width="1.5"
          stroke-dasharray="4 3"
          opacity="0.7" />

    <!-- Munich marker -->
    <circle cx="30" cy="32" r="5" fill="#a47864" opacity="0.25" />
    <circle cx="30" cy="32" r="3" fill="#a47864" opacity="0.5" />
    <circle cx="30" cy="32" r="1.5" fill="#a47864" />

    <!-- Munich label -->
    <text x="30" y="24"
          font-family="Cormorant Garamond, serif"
          font-size="7"
          fill="#7d6e64"
          text-anchor="middle"
          opacity="0.8">München</text>

    <!-- Ruhpolding marker (destination - slightly larger) -->
    <circle cx="150" cy="62" r="6" fill="#a47864" opacity="0.2" />
    <circle cx="150" cy="62" r="4" fill="#a47864" opacity="0.4" />
    <circle cx="150" cy="62" r="2" fill="#a47864" />

    <!-- Ruhpolding label -->
    <text x="150" y="54"
          font-family="Cormorant Garamond, serif"
          font-size="6"
          fill="#7d6e64"
          text-anchor="middle"
          opacity="0.8">Ruhpolding</text>

    <!-- Subtle mountain hints at bottom (Alps) -->
    <path d="M 0 80 Q 20 72, 40 75 Q 60 70, 80 73 Q 100 68, 120 72 Q 140 67, 160 70 Q 180 73, 180 80 Z"
          fill="#d8ccc4" opacity="0.3" />
  </g>
</svg>
